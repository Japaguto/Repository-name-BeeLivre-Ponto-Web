<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeeLivre Ponto</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    button {
      width: 100%;
      padding: 18px;
      font-size: 18px;
      cursor: pointer;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      background: #000;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

    #resultado {
      margin-top: 15px;
      padding: 15px;
      background: #f3f3f3;
      border-radius: 10px;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>BeeLivre Ponto</h1>

  <button id="lerQR">
    Ler QR Code
  </button>

  <div id="status">
    Aguardando teste.
  </div>

  <video
    id="camera"
    autoplay
    playsinline
    muted>
  </video>

  <div id="resultado">
    Nenhum QR lido ainda.
  </div>

  <script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

  <script>
    const botao = document.getElementById("lerQR");
    const video = document.getElementById("camera");
    const status = document.getElementById("status");
    const resultado = document.getElementById("resultado");

    let controles = null;

    botao.addEventListener("click", async () => {
      try {

        if (controles) {
          controles.stop();
          controles = null;
        }

        status.textContent = "Abrindo câmera e procurando QR...";

        const leitor = new ZXingBrowser.BrowserQRCodeReader();

        controles = await leitor.decodeFromConstraints(
          {
            video: {
              facingMode: {
                ideal: "environment"
              }
            },
            audio: false
          },
          video,
          (result, error, controls) => {

            if (result) {

              const texto = result.getText();

              resultado.textContent = texto;
              status.textContent = "✅ QR lido com sucesso.";

              controls.stop();
              controles = null;
            }
          }
        );

      } catch (erro) {

        status.textContent =
          "❌ Erro: " +
          erro.name +
          " - " +
          erro.message;

      }
    });
  </script>

</body>
</html>
